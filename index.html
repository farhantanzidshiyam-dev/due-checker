</head>
<body>

<footer>

<script>
(function(){
  /* Same Firebase project as the main app. The main app already publishes one small public record per
     phone number (collection public_dues, id = "p" + SHA-256("rgce-due-v1:" + number)). This page only reads it. */
  var FB_PROJECT='rgce-sparkdesk', FB_KEY='AIzaSyAqsPu8YK5xFHEoWTmZLzJl6z9NmchdrEg', SHOP_PHONE='+8801715986646';

  var T={
    en:{help:'For any issue about your due amount, please contact',pow:'Powered by',tag:'Due check',mainApp:'Go to main app',h1:'Check your due',sub:'Search with your mobile number or any part of your name. No login needed.',byNum:'Mobile number',byName:'Name',namePh:'Name (part is fine)',nameBad:'Type at least 2 letters of the name.',noList:'Name search is not switched on yet. Please search by mobile number.',more:'Showing the first 20. Type more of the name to narrow it down.',nameNote:'Address is hidden for name search. Use your mobile number for full details.',check:'Check',addr:'Moshjid Market, Naohata Mor, Mohadevpur, Naogaon',call:'Shop phone',
        bad:'Enter a valid mobile number (01XXXXXXXXX).',wait:'Too many tries. Please wait a minute.',none:'No due record found. Please check the number or name, or contact the shop.',err:'Could not check right now. Please try again later.',
        name:'Name',addrL:'Address',srcL:'Source',due:'Current due',clear:'No due. Thank you!',upd:'Updated',many:' customers use this number',other:'Bangla'},
    bn:{help:'বাকির পরিমাণ নিয়ে কোনো সমস্যা হলে যোগাযোগ করুন',pow:'Powered by',tag:'বাকি দেখুন',mainApp:'মূল অ্যাপে যান',h1:'আপনার বাকি দেখুন',sub:'মোবাইল নম্বর বা নামের যেকোনো অংশ দিয়ে খুঁজুন। লগইন লাগবে না।',byNum:'মোবাইল নম্বর',byName:'নাম',namePh:'নাম (আংশিক হলেও চলবে)',nameBad:'নামের কমপক্ষে ২ অক্ষর লিখুন।',noList:'নাম দিয়ে খোঁজা এখনো চালু হয়নি। মোবাইল নম্বর দিয়ে খুঁজুন।',more:'প্রথম ২০টি দেখানো হচ্ছে। নামের আরও অংশ লিখে সীমিত করুন।',nameNote:'নাম দিয়ে খুঁজলে ঠিকানা দেখানো হয় না। পূর্ণ তথ্যের জন্য মোবাইল নম্বর দিন।',check:'দেখুন',addr:'মসজিদ মার্কেট, নওহাটা মোড়, মহাদেবপুর, নওগাঁ',call:'দোকানের ফোন',
        bad:'সঠিক মোবাইল নম্বর লিখুন (01XXXXXXXXX)।',wait:'অনেকবার চেষ্টা হয়েছে। এক মিনিট অপেক্ষা করুন।',none:'কোনো বাকির তথ্য পাওয়া যায়নি। নম্বর বা নাম দেখে নিন, অথবা দোকানে যোগাযোগ করুন।',err:'এখন দেখা যাচ্ছে না। পরে আবার চেষ্টা করুন।',
        name:'নাম',addrL:'ঠিকানা',srcL:'সোর্স',due:'বর্তমান বাকি',clear:'কোনো বাকি নেই। ধন্যবাদ!',upd:'হালনাগাদ',many:' জন গ্রাহক এই নম্বর ব্যবহার করেন',other:'English'}
  };
  var mode='name', lang='en'; try{ lang=localStorage.getItem('due_lang')==='bn'?'bn':'en'; }catch(e){}
  var $=function(i){return document.getElementById(i);}, out=$('out'), ph=$('ph'), go=$('go'), last=null, tries=[], busy=false;
  function t(k){ return T[lang][k]; }
  function applyLang(){
    document.documentElement.lang=lang;
    document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent=t(el.getAttribute('data-t')); });
    $('lang').textContent=t('other'); ph.placeholder=mode==='num'?'01XXXXXXXXX':t('namePh');
    if(last) render(last);
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function sv(v){ if(v==null) return ''; if(typeof v==='object'){ v=v.stringValue!==undefined?v.stringValue:(v.integerValue!==undefined?v.integerValue:(v.doubleValue!==undefined?v.doubleValue:'')); } return String(v==null?'':v).trim(); }
  function money(n){ return '\u09F3'+Math.round(n).toLocaleString('en-US'); }
  function normName(s){ return String(s||'').normalize('NFC').toLowerCase().replace(/\s+/g,' ').trim(); }
  var SKEY='due_state';
  function saveState(searched){ try{ sessionStorage.setItem(SKEY,JSON.stringify({m:mode,q:ph.value,s:!!searched})); }catch(e){} }
  function setMode(m){
    mode=m; $('mNum').setAttribute('aria-pressed',m==='num'); $('mName').setAttribute('aria-pressed',m==='name');
    ph.value=''; ph.type=m==='num'?'tel':'text'; ph.inputMode=m==='num'?'numeric':'text';
    ph.placeholder=m==='num'?'01XXXXXXXXX':t('namePh'); $('pre').style.display=m==='num'?'':'none';
    last=null; out.innerHTML=''; $('help').hidden=true; saveState(false); ph.focus();
  }
  function norm(p){
    var d=String(p||'').replace(/[\u09E6-\u09EF]/g,function(c){return String(c.charCodeAt(0)-0x09E6);}).replace(/\D/g,'');
    if(d.indexOf('00880')===0) d=d.slice(4); else if(d.indexOf('880')===0) d=d.slice(2);
    if(d.length===10&&d.charAt(0)==='1') d='0'+d;
    return /^01\d{9}$/.test(d)?d:'';
  }
  async function sha(s){
    var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));
    return Array.prototype.map.call(new Uint8Array(b),function(x){return ('0'+x.toString(16)).slice(-2);}).join('');
  }
  function msg(text,warn){ last=null; $('help').hidden=true; out.innerHTML='<div class="msg'+(warn?' warn':'')+'">'+esc(text)+'</div>'; }
  function render(r){
    last=r; var arr=r.list, h='';
    if(arr.length>1) h+='<p class="count">'+arr.length+esc(t('many'))+'</p>';
    arr.forEach(function(x){
      h+='<div class="card'+(x.due>0?' bad':'')+'"><div class="nm">'+esc(t('name'))+': <b>'+esc(x.nm)+'</b></div>'
        +(x.ad?'<div class="ad">'+esc(t('addrL'))+': '+esc(x.ad)+'</div>':'')
        +(x.src?'<div class="ad">'+esc(t('srcL'))+': '+esc(x.src)+'</div>':'')
        +(x.due>0?'<div class="lab">'+esc(t('due'))+'</div><div class="amt">'+esc(money(x.due))+'</div>':'<div class="amt clear">'+esc(t('clear'))+'</div>')
        +'</div>';
    });
    if(r.more) h+='<div class="upd">'+esc(t('more'))+'</div>';
    if(r.upd) h+='<div class="upd">'+esc(t('upd'))+': '+esc(r.upd)+'</div>';
    if(location.hash==='#debug') h+='<pre style="white-space:pre-wrap;font-size:12px;color:var(--muted)">page v3 | '+esc(JSON.stringify(arr))+'</pre>';
    out.innerHTML=h; $('help').hidden=false;
  }
  var cache={at:0,rows:[]};
  async function loadAll(){
    if(Date.now()-cache.at<60000&&cache.rows.length) return cache.rows;
    var rows=[], tok='', base='https://firestore.googleapis.com/v1/projects/'+FB_PROJECT+'/databases/(default)/documents/public_dues?pageSize=300&key='+FB_KEY;
    for(var pg=0;pg<20;pg++){
      var r=await fetch(base+(tok?'&pageToken='+encodeURIComponent(tok):''),{cache:'no-store'});
      if(r.status===403||r.status===401){ var e=new Error('list'); e.noList=true; throw e; }
      if(!r.ok) throw new Error('http '+r.status);
      var j=await r.json();
      (j.documents||[]).forEach(function(d){
        var f=d.fields||{}, upd='';
        try{ if(f.upd&&f.upd.timestampValue) upd=new Date(f.upd.timestampValue).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){}
        var arr=null; try{ if(f.cs&&f.cs.stringValue) arr=JSON.parse(f.cs.stringValue); }catch(e){}
        if(!arr||!arr.length) arr=[{nm:(f.nm&&f.nm.stringValue)||'-',ad:(f.ad&&f.ad.stringValue)||'',src:sv(f.src||f.source),due:Number(f.due&&(f.due.integerValue!==undefined?f.due.integerValue:f.due.doubleValue))||0}];
        arr.forEach(function(x){ rows.push({nm:x.nm||'-',ad:x.ad||'',src:sv(x.src!=null?x.src:x.source),due:Number(x.due)||0,upd:upd,k:normName(x.nm)}); });
      });
      tok=j.nextPageToken||''; if(!tok) break;
    }
    cache={at:Date.now(),rows:rows}; return rows;
  }
  async function check(){
    if(busy) return;
    var p, q;
    if(mode==='num'){ p=norm(ph.value); if(!p){ msg(t('bad'),true); return; } }
    else { q=normName(ph.value); if(q.length<2){ msg(t('nameBad'),true); return; } }
    var now=Date.now(); tries=tries.filter(function(x){return now-x<60000;});
    if(tries.length>=8){ msg(t('wait'),true); return; }
    tries.push(now); saveState(true); busy=true; go.disabled=true; last=null; $('help').hidden=true;
    out.innerHTML='<div class="msg"><div class="sk" style="width:70%"></div><div class="sk" style="width:45%"></div></div>';
    try{
      if(mode==='name'){
        var words=q.split(' ').filter(Boolean), rows=await loadAll();
        var hit=rows.filter(function(x){ return words.every(function(w){ return x.k.indexOf(w)>-1; }); });
        hit.sort(function(a,b){ return (a.k.indexOf(words[0])===0?0:1)-(b.k.indexOf(words[0])===0?0:1) || a.k.localeCompare(b.k); });
        if(!hit.length){ msg(t('none')); return; }
        var upd=hit[0].upd, list=hit.slice(0,20).map(function(x){return {nm:x.nm,ad:x.ad,src:x.src,due:x.due};});
        render({byName:true,upd:upd,list:list,more:hit.length>20}); return;
      }
      if(!(window.crypto&&crypto.subtle)) throw new Error('n/a');
      var id='p'+await sha('rgce-due-v1:'+p);
      var r=await fetch('https://firestore.googleapis.com/v1/projects/'+FB_PROJECT+'/databases/(default)/documents/public_dues/'+id+'?key='+FB_KEY,{cache:'no-store'});
      if(r.status===404){ msg(t('none')); return; }
      if(!r.ok) throw new Error('http '+r.status);
      var f=(await r.json()).fields||{};
      var due=Number(f.due&&(f.due.integerValue!==undefined?f.due.integerValue:f.due.doubleValue))||0;
      var nm=(f.nm&&f.nm.stringValue)||'-', ad=(f.ad&&f.ad.stringValue)||'', upd2='';
      try{ if(f.upd&&f.upd.timestampValue) upd2=new Date(f.upd.timestampValue).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }catch(e){}
      var arr=null; try{ if(f.cs&&f.cs.stringValue) arr=JSON.parse(f.cs.stringValue); }catch(e){}
      if(!arr||!arr.length) arr=[{nm:nm,ad:ad,src:sv(f.src||f.source),due:due}];
      render({byName:false,upd:upd2,list:arr.map(function(x){return {nm:x.nm||'-',ad:x.ad||'',src:sv(x.src!=null?x.src:x.source),due:Number(x.due)||0};})});
    }catch(e){ console.warn('due lookup',e); msg(e&&e.noList?t('noList'):t('err'),true); }
    finally{ busy=false; go.disabled=false; }
  }
  $('f').addEventListener('submit',function(e){ e.preventDefault(); check(); });
  $('lang').addEventListener('click',function(){ lang=lang==='bn'?'en':'bn'; try{ localStorage.setItem('due_lang',lang); }catch(e){} applyLang(); });
  $('mNum').addEventListener('click',function(){ if(mode!=='num') setMode('num'); });

  /* Restore search after coming back from the main app (back button) */
  (function(){
    var st=null; try{ st=JSON.parse(sessionStorage.getItem(SKEY)||'null'); }catch(e){}
    if(st&&(st.m==='num'||st.m==='name')){
      mode=st.m; $('mNum').setAttribute('aria-pressed',mode==='num'); $('mName').setAttribute('aria-pressed',mode==='name');
      ph.type=mode==='num'?'tel':'text'; ph.inputMode=mode==='num'?'numeric':'text'; $('pre').style.display=mode==='num'?'':'none';
      ph.value=st.q||'';
    }
    applyLang();
    if(st&&st.s&&ph.value) check();
  })();
})();
  /* Block copy/select/drag outside input boxes */
  function inField(e){ var t=e.target; return t&&t.closest&&t.closest('input,textarea'); }
  ['copy','cut','selectstart','dragstart','contextmenu'].forEach(function(ev){
    document.addEventListener(ev,function(e){ if(!inField(e)) e.preventDefault(); });
  });
</script>
